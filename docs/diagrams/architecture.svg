<title id="title">Secure RAG AI Chatbot — illustrated architecture</title>
<desc id="desc">Permitted evidence first; optional cited AI answers. The included client is a local CLI with keyword retrieval. Hosted identity, a chat interface and live model quality require separate integration.</desc>
